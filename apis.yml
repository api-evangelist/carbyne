aid: carbyne
name: Carbyne
description: 'Carbyne is a cloud-native mission-critical contact center and emergency
  communications company whose platform — sold as Axon 911 Core and Carbyne APEX —
  powers 9-1-1, 3-1-1 and non-emergency call handling for Public Safety Answering Points
  (PSAPs), enterprises, and transportation, education and GSOC operators. The platform
  delivers caller device location, live video, audio streaming, Text-to-911, AI transcription
  and real-time translation, emergency call triage, wallboards, analytics and event
  history to telecommunicators, and integrates with CAD, ESInet, voice recorders, PBX,
  mapping and IoT systems through a contract-gated open API governed by published API
  Terms of Use. Founded in 2015 in Tel Aviv and New York as Reporty Homeland Security,
  Carbyne operates roughly 300 emergency response centers worldwide and was acquired
  by Axon Enterprise in 2025.'
